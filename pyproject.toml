[project]
name = "concordance"
version = "0.1.0"
description = "Sync reading position between a KOReader ebook in Calibre-Web Automated and its Audiobookshelf audiobook"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Philip Steingrüber" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]
keywords = ["audiobookshelf", "calibre-web", "koreader", "kobo", "forced-alignment", "whispersync"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
concordance = "concordance.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["concordance*"]

[tool.ruff]
line-length = 110
